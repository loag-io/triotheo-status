name: uptime

# Probe triotheo.com from GitHub's runners and keep the status page's data (check.py).
# The page itself is served by GitHub Pages from this branch, so it stays up when the box does not.
#
# WHAT RUNS IT, AND WHY NOT GITHUB'S SCHEDULE ALONE (2026-10-17). GitHub's `schedule` trigger is best-effort,
# and on this repository it never fired at all: zero scheduled runs in five and a half hours, through "*/10"
# and then the off-the-hour "4-59/10" GitHub's own docs recommend, while every manual dispatch ran at once.
# So the ten-minute cadence comes from OUTSIDE: a cron-job.org job POSTs the workflow_dispatch endpoint
#   POST https://api.github.com/repos/loag-io/triotheo-status/actions/workflows/uptime.yml/dispatches
#   {"ref": "main"}   →   204 No Content
# with a fine-grained token that can do one thing — Actions read/write on this repository and no other.
# The token lives only in that job (never in this repo); cron-job.org emails the owner if a call fails.
# The schedule below stays as an HOURLY fallback, should GitHub ever start honouring it. Not every ten
# minutes: with both firing that often, Pages would build twelve times an hour, over its documented soft
# limit of ten for branch-published sites.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Probe the site
        # stdlib only; writes status.json / history.json / incidents.json, and notify.txt only
        # when a service changed state (down after two consecutive failed runs; back at once)
        run: python3 check.py "${{ vars.STATUS_HOST || 'status.triotheo.com' }}"

      - name: Say it on Discord, if there is anything to say
        if: hashFiles('notify.txt') != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::notify.txt was written but DISCORD_WEBHOOK is not set — nobody was told:"; cat notify.txt; exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          body = json.dumps({"flags": 4, "content": open("notify.txt").read()[:1900]}).encode()
          req = urllib.request.Request(os.environ["DISCORD_WEBHOOK"], data=body, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=15) as r: print("discord:", r.status)
          PY
          rm -f notify.txt

      - name: Record the check
        # one commit per run keeps the history honest; the page reads these files straight off Pages
        run: |
          git config user.name "triotheo-status"
          git config user.email "status@triotheo.com"
          git add status.json history.json incidents.json
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "check: $(python3 -c "import json;s=json.load(open('status.json'));print(s['overall'],s['checked_at'])")"
          git push
